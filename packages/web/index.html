<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelPoolHall Physics Debug</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="stage">
        <canvas id="table"></canvas>
        <div class="timeline">
          <button id="play" type="button">Play</button>
          <input id="time" type="range" min="0" max="1000" value="0" step="1" />
          <output id="clock">0.000 s</output>
          <select id="speed" aria-label="Playback speed">
            <option value="0.1">0.1×</option>
            <option value="0.25">0.25×</option>
            <option value="1" selected>1×</option>
          </select>
        </div>
      </section>
      <aside class="panel">
        <h1>Physics debug</h1>
        <label>Category <select id="category"></select></label>
        <label>Shot <select id="shot"></select></label>
        <fieldset>
          <legend>Strike</legend>
          <label>V0 (m/s) <input id="V0" type="number" step="0.1" /></label>
          <label>phi (°) <input id="phi" type="number" step="0.5" /></label>
          <label>theta (°) <input id="theta" type="number" step="1" /></label>
          <label>a (side) <input id="a" type="number" step="0.05" min="-0.9" max="0.9" /></label>
          <label>b (height) <input id="b" type="number" step="0.05" min="-0.9" max="0.9" /></label>
        </fieldset>
        <label class="check"><input id="paths" type="checkbox" checked /> Paths</label>
        <label class="check"><input id="markers" type="checkbox" checked /> Event markers</label>
        <label class="check"><input id="overlay" type="checkbox" checked /> pooltool events (rings)</label>
        <p id="summary" class="summary"></p>
        <ol id="events" class="events"></ol>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
